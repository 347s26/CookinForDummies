<!DOCTYPE html>
{% load allauth %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CookinForDummies</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/generic.css' %}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">CookinForDummies</h1>
            <ul class="nav-links">
                <li><a href="{% url 'index' %}">Home</a></li>
                <li><a href="{% url 'my-recipes' %}">My Recipes</a></li>
                <li><a href="{% url 'skills' %}">Skills</a></li>
                <li><a href="{% url 'about' %}">About</a></li>
                <li><a href="{% url 'search' %}">Search</a></li>
                <li><a href="/accounts/login/" class="btn btn-outline-light">Sign In</a></li>
                <li><a href="/accounts/signup/" class="btn btn-success">Sign Up</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}
        <!--this will contain page specific html using a different html file-->
        {% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 CookinForDummies</p>
        <div class="footer-links">
            <a href="{% url 'about' %}">About</a>
            <a href="#">Contact</a>
        </div>
    </footer>

</body>
</html>
