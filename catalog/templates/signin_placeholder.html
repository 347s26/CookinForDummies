{% extends "base_generic.html"%}


{% block content %}
    <h1 style="text-align: center; margin-bottom: 20px;">Sign In</h1>

    <div style="max-width: 420px; margin: 0 auto; border: 1px solid #ccc; border-radius: 12px; padding: 24px; background-color: #fff;">
        <label style="display: block; margin-bottom: 8px; font-weight: bold;">Email</label>
        <input type="email" placeholder="you@example.com" disabled style="width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 8px;">

        <label style="display: block; margin-bottom: 8px; font-weight: bold;">Password</label>
        <input type="password" placeholder="••••••••" disabled style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px;">

        <button type="button" disabled style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background-color: #f2f2f2; color: #666; font-weight: bold; cursor: not-allowed;">
            Sign In (Placeholder)
        </button>
    </div>
{% endblock %}
