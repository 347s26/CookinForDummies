{% extends "base_generic.html" %}

{% block content %}
    <h1>Delete Recipe</h1>
    <p>Are you sure you want to delete "{{ object.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete it</button>
    </form>

    <p><a href="{{ object.get_absolute_url }}">Cancel</a></p>
{% endblock %}
