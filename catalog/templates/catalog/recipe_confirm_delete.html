{% extends "base_generic.html" %}

{% block content %}
<div class="delete-recipe-page">
    <div class="delete-recipe-card">
        <h1 class="delete-title">Delete Recipe</h1>

        <p class="delete-message">
            Are you sure you want to permanently delete
            <span class="delete-recipe-name">"{{ object.title }}"</span>?
        </p>

        <form method="post" class="delete-form">
            {% csrf_token %}
            <button type="submit" class="delete-confirm-btn">
                Yes, Delete Recipe
            </button>
        </form>

        <a href="{{ object.get_absolute_url }}" class="delete-cancel-btn">
            Cancel
        </a>
    </div>
</div>
{% endblock %}
